---
name: Nginx Proxy Manager (Fork)
version: "2.15.1"
slug: nginxproxymanager-fork
image: ghcr.io/benperove/nginxproxymanager-fork/{arch}
description: Manage Nginx proxy hosts with a simple, powerful interface (custom fork)
url: https://github.com/benperove/addon-nginx-proxy-manager
webui: http://[HOST]:[PORT:81]
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
map:
  - addon_config:rw
backup_exclude:
  - "*/logs"
